<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="huixin.plus — 个人主页" />
  <title>huixin.plus</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --fg: #e2e8f0;
      --accent: #38bdf8;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #1e293b 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, #312e81 0%, transparent 50%),
        var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      margin: 0 0 1rem;
      background: linear-gradient(120deg, #38bdf8, #a855f7, #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.03em;
    }
    p.tagline {
      font-size: 1.125rem;
      color: var(--muted);
      max-width: 36rem;
      line-height: 1.6;
      margin: 0 0 2.5rem;
    }
    .links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .links a {
      color: var(--fg);
      text-decoration: none;
      padding: 0.6rem 1.4rem;
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 999px;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }
    .links a:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }
    footer {
      position: fixed;
      bottom: 1rem;
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>huixin.plus</h1>
    <p class="tagline">
      Hello, world. ✨<br />
      This site is under construction.
    </p>
    <div class="links">
      <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:hi@huixin.plus">Email</a>
    </div>
  </main>
  <footer>© 2026 huixin.plus</footer>
</body>
</html>
